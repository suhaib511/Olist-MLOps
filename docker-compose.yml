services:
  api:
    image: olist-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist-api-compose
    ports:
      - "8001:8000"
    environment:
      MLFLOW_TRACKING_URI: http://host.docker.internal:5001
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://olist-artifact-storage:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  postgres:
    image: postgres:16
    container_name: olist-postgres-compose
    environment:
      POSTGRES_DB: olist_task3
      POSTGRES_USER: olist_app
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "5433:5432"
    volumes:
      - task3_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist_app -d olist_task3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: ghcr.io/seaweedfs/minio-compat:latest
    container_name: olist-artifact-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
    ports:
    - "9100:9000"
    - "9001:9001"
    volumes:
      - task3_artifact_data:/data
    restart: unless-stopped
volumes:
  task3_postgres_data:
  task3_artifact_data: